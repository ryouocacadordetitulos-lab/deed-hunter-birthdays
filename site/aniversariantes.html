<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aniversariantes — Deed Hunter The Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #080808;
  font-family: 'Inter', sans-serif;
  color: white;
  position: relative;
}

/* Subtle warm glow in center-bottom */
body::before {
  content: '';
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 800px; height: 400px;
  background: radial-gradient(ellipse, rgba(201,168,76,0.06) 0%, transparent 70%);
  pointer-events: none;
}

.slide {
  width: 1920px;
  height: 1080px;
  padding: 80px 120px 60px;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 32px;
}

.header-left {}

.label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 6px;
  color: #C9A84C;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.month-title {
  font-size: 110px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1;
  letter-spacing: -2px;
}

.year-label {
  font-size: 18px;
  font-weight: 300;
  color: #C9A84C;
  letter-spacing: 4px;
  margin-top: 24px;
  align-self: flex-start;
}

/* Divider */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, #C9A84C 0%, rgba(201,168,76,0.3) 40%, transparent 100%);
  margin-bottom: 60px;
}

/* Cards grid */
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  flex: 1;
  align-items: center;
}

.card {
  background: #0f0f0f;
  border: 1px solid #1e1e1e;
  border-radius: 4px;
  padding: 48px 40px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  position: relative;
}

/* Subtle left gold border accent */
.card::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 1px;
  background: linear-gradient(180deg, transparent, #C9A84C, transparent);
}

.card-day {
  font-size: 96px;
  font-weight: 200;
  color: #C9A84C;
  line-height: 1;
  letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
}

.card-month {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 5px;
  color: #C9A84C;
  text-transform: uppercase;
  margin-top: 8px;
  opacity: 0.7;
}

.card-dash {
  width: 32px;
  height: 1px;
  background: #C9A84C;
  margin: 28px 0;
  opacity: 0.5;
}

.card-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #ffffff;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.5;
}

.card-btn {
  margin-top: auto;
  padding-top: 28px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 4px;
  color: #C9A84C;
  text-transform: uppercase;
  opacity: 0.6;
}

/* Bottom footer */
.footer {
  display: flex;
  justify-content: center;
  align-items: center;
  padding-top: 40px;
  gap: 20px;
}

.footer-logo-text {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 5px;
  color: #C9A84C;
  text-transform: uppercase;
  opacity: 0.5;
}

/* Logo image */
.deed-hunter-logo {
  height: 80px;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 0 20px rgba(201,168,76,0.3));
}

/* Top right logo small */
.brand-mark {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
</style>
</head>
<body>
<div class="slide">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="label">Aniversariantes</div>
      <div class="month-title">Abril</div>
    </div>
    <div class="brand-mark">
      <!-- Try to load logo, fallback to text if not found -->
      <img src="logo.png" class="deed-hunter-logo" onerror="this.style.display='none'; document.getElementById('brand-fallback').style.display='block'">
      <div id="brand-fallback" style="display:none; text-align:right;">
        <div style="font-size:32px; font-weight:900; letter-spacing:2px; color:#C9A84C; text-shadow: 0 0 30px rgba(201,168,76,0.4);">DEED HUNTER</div>
        <div style="font-size:13px; letter-spacing:6px; color:#C9A84C; opacity:0.6; margin-top:4px;">THE GAME</div>
      </div>
      <div class="year-label">2026</div>
    </div>
  </div>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Cards -->
  <div class="cards">
    <div class="card">
      <div class="card-day">05</div>
      <div class="card-month">Abril</div>
      <div class="card-dash"></div>
      <div class="card-name">CASSIO<br>GOMES</div>
      <div class="card-btn">Feliz Aniversário</div>
    </div>
    <div class="card">
      <div class="card-day">13</div>
      <div class="card-month">Abril</div>
      <div class="card-dash"></div>
      <div class="card-name">FELIPPE<br>CASARIM</div>
      <div class="card-btn">Feliz Aniversário</div>
    </div>
    <div class="card">
      <div class="card-day">21</div>
      <div class="card-month">Abril</div>
      <div class="card-dash"></div>
      <div class="card-name">GABRIEL<br>QUESADA</div>
      <div class="card-btn">Feliz Aniversário</div>
    </div>
    <div class="card">
      <div class="card-day">21</div>
      <div class="card-month">Abril</div>
      <div class="card-dash"></div>
      <div class="card-name">JOBSON<br>CRISOSTOMO</div>
      <div class="card-btn">Feliz Aniversário</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-logo-text">DEED HUNTER · THE GAME · ANIVERSARIANTES · ABRIL 2026</div>
  </div>
</div>
</body>
</html>
